      <path d="M23 15 A23 23 0 1 0 37 15" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
      <!-- Vertical Power Line through center -->
      <line x1="30" y1="2" x2="30" y2="28" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
    </g>
    
    <!-- Letter W -->
    <path d="M122 5 L135 65 H148 L159 23 L170 65 H183 L196 5 H182 L174 44 L164 5 H154 L144 44 L136 5 Z" fill="#FFFFFF"/>
    
    <!-- Letter E -->
    <path d="M204 5 H238 V17 H218 V28 H234 V39 H218 V53 H238 V65 H204 Z" fill="#FFFFFF"/>
    
    <!-- Letter R -->
    <path d="M246 5 H273 C286 5 292 11 292 23 C292 31 288 37 280 40 L295 65 H279 L266 43 H260 V65 H246 Z M260 17 V31 H271 C276 31 278 29 278 24 C278 19 276 17 271 17 Z" fill="#FFFFFF"/>
    
    <!-- CELL in Yellow Gold #FFB800 -->
    <!-- Letter C -->
    <path d="M334 18 C330 10 323 5 312 5 C297 5 288 17 288 35 C288 53 297 65 312 65 C323 65 330 60 334 52 L323 45 C320 49 317 52 312 52 C305 52 301 45 301 35 C301 25 305 18 312 18 C317 18 320 21 323 25 Z" fill="#FFB800" transform="translate(14, 0)"/>
    
    <!-- Letter E -->
    <path d="M344 5 H378 V17 H358 V28 H374 V39 H358 V53 H378 V65 H344 Z" fill="#FFB800" transform="translate(14, 0)"/>
    
    <!-- Letter L -->
    <path d="M386 5 H400 V53 H418 V65 H386 Z" fill="#FFB800" transform="translate(10, 0)"/>
    
    <!-- Letter L -->
    <path d="M422 5 H436 V53 H454 V65 H422 Z" fill="#FFB800" transform="translate(6, 0)"/>
  </g>
  
  <!-- Subtitle: – Assistência técnica – -->
  <g transform="translate(200, 110)">
    <text text-anchor="middle" fill="#E2E8F0" font-family="'Inter', -apple-system, sans-serif" font-size="16" font-weight="500" letter-spacing="4">
      — ASSISTÊNCIA TÉCNICA —
    </text>
  </g>
</svg>
