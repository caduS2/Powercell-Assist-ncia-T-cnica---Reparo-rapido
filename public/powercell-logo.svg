    <path d="M0 5 H26 C38 5 44 11 44 23 C44 35 38 41 26 41 H14 V65 H0 Z M14 17 V29 H24 C28 29 30 27 30 23 C30 19 28 17 24 17 Z" fill="#FFFFFF"/>
    
